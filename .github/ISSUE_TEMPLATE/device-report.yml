name: Device report
description: What Space Probe found out about your SpaceMouse (docs/adr/0006).
title: "Device report: "
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Space Probe has put its report on your clipboard: paste it into the field "Report" below (⌘V).
        The report contains what your device declares and sends, what you typed in the probe, and its serial number.
  - type: input
    id: model
    attributes:
      label: Model, as printed on the device
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: The JSON from Space Probe.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Receiver or cable, what worked and what did not.
